```html
<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PEMIRA — Voting</title>

  <style>
    html,
    body,
    #app {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
    }

    #app {
      position: relative;
    }

    #figma {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    #status {
      position: fixed;
      left: 10px;
      bottom: 10px;
      z-index: 10;

      background: rgba(0, 0, 0, 0.72);
      color: #fff;

      font: 12px/1.4 system-ui, sans-serif;

      padding: 7px 9px;
      border-radius: 7px;

      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div id="app">
    <iframe
      id="figma"
      allowfullscreen>
    </iframe>

    <div id="status"></div>
  </div>

  <script>
    /*
     * =========================================================
     * CONFIGURATION
     * =========================================================
     */

    const CONFIG = {

      /*
       * Figma prototype
       */
      FIGMA_FILE_KEY: "ye6WV9CRpb5QpyPNjcD7o7",

      /*
       * Figma Embed API Client ID
       */
      FIGMA_CLIENT_ID: "WtJAjvjMcjz1x0tX3D8kgZ",

      /*
       * Starting point prototype
       */
      START_NODE_ID: "61-293",

      /*
       * Google Apps Script Web App
       */
      API_URL:
        "https://script.google.com/macros/s/AKfycbzNGL-Oh0igs4seEXKuXY1FUPSkPM6lJzoRfqZT5wL8_a8OGyQCA775kExwElQxGGO0nw/exec",

      /*
       * Tombol konfirmasi vote.
       *
       * Format:
       * "NODE_ID": "PASLON"
       */
      VOTE_BUTTONS: {
        "133:1031": "Paslon 1",
        "133:933": "Paslon 2",
        "133:982": "Paslon 3"
      },

      /*
       * Text node di dalam tombol.
       *
       * Dipakai sebagai fallback apabila event Figma
       * mengembalikan ID text layer, bukan parent button.
       */
      VOTE_TEXT_NODES: {
        "133:1032": "Paslon 1",
        "133:934": "Paslon 2",
        "133:983": "Paslon 3"
      }
    };


    /*
     * =========================================================
     * DEV MODE
     * =========================================================
     */

    const params = new URLSearchParams(window.location.search);
    const dev = params.get("dev");

    if (!["1", "2", "3"].includes(dev)) {

      document.body.innerHTML = `
        <div style="
          font: 20px system-ui, sans-serif;
          color: white;
          padding: 30px;
        ">
          Link Dev tidak valid.
          Gunakan ?dev=1, ?dev=2, atau ?dev=3.
        </div>
      `;

      throw new Error("Invalid dev parameter");
    }


    /*
     * =========================================================
     * ELEMENTS
     * =========================================================
     */

    const iframe = document.getElementById("figma");
    const statusEl = document.getElementById("status");


    /*
     * =========================================================
     * VALIDATE CONFIG
     * =========================================================
     */

    if (!CONFIG.FIGMA_FILE_KEY) {
      throw new Error("FIGMA_FILE_KEY belum diisi.");
    }

    if (!CONFIG.FIGMA_CLIENT_ID) {
      throw new Error("FIGMA_CLIENT_ID belum diisi.");
    }

    if (!CONFIG.START_NODE_ID) {
      throw new Error("START_NODE_ID belum diisi.");
    }

    if (!CONFIG.API_URL) {
      throw new Error("API_URL belum diisi.");
    }


    /*
     * =========================================================
     * FIGMA EMBED URL
     * =========================================================
     *
     * PENTING:
     * Jangan hapus tanda "+" pada akhir baris.
     * String URL memang sedang disambung antarbaris.
     */

    const figmaUrl =
      `https://embed.figma.com/proto/${CONFIG.FIGMA_FILE_KEY}/IT-DOK-PEMIRA` +
      `?node-id=${encodeURIComponent(CONFIG.START_NODE_ID)}` +
      `&starting-point-node-id=${encodeURIComponent(CONFIG.START_NODE_ID)}` +
      `&embed-host=pemira-voting` 
     


    /*
     * Pasang URL ke iframe.
     */

    iframe.src = figmaUrl;


    /*
     * =========================================================
     * DEBUG
     * =========================================================
     */

    function debug(message) {
      console.log("[PEMIRA]", message);

      statusEl.textContent =
        `Dev ${dev} · ${message}`;
    }


    /*
     * Tampilkan URL Figma untuk pengecekan.
     */

    console.log("[PEMIRA] Figma URL:", figmaUrl);
    console.log("[PEMIRA] Dev:", dev);
    console.log("[PEMIRA] API URL:", CONFIG.API_URL);


    /*
     * =========================================================
     * VOTING STATE
     * =========================================================
     */

    let lastVote = null;
    let sending = false;


    /*
     * =========================================================
     * SEND VOTE
     * =========================================================
     */

    function sendVote(paslon) {

      if (!paslon) {
        return;
      }

      if (sending) {
        console.log(
          "[PEMIRA] Request masih berjalan."
        );
        return;
      }

      if (lastVote === paslon) {
        console.log(
          "[PEMIRA] Vote yang sama sudah dikirim:",
          paslon
        );
        return;
      }

      sending = true;

      debug(`mengirim ${paslon}...`);

      const url =
        `${CONFIG.API_URL}` +
        `?dev=${encodeURIComponent(dev)}` +
        `&paslon=${encodeURIComponent(paslon)}` +
        `&t=${Date.now()}`;

      console.log("[PEMIRA] Vote URL:", url);


      /*
       * Image request dipakai supaya tidak terkena
       * CORS/preflight seperti fetch POST.
       */

      const img = new Image();

      img.onload = () => {

        lastVote = paslon;
        sending = false;

        debug(`tersimpan: ${paslon}`);

        console.log(
          "[PEMIRA] Vote berhasil dikirim:",
          paslon
        );
      };


      img.onerror = () => {

        /*
         * Apps Script kadang tetap memproses GET
         * walaupun browser menganggap response image
         * sebagai error.
         */

        lastVote = paslon;
        sending = false;

        debug(`request dikirim: ${paslon}`);

        console.log(
          "[PEMIRA] Request selesai dikirim:",
          paslon
        );
      };


      img.src = url;
    }


    /*
     * =========================================================
     * FIGMA IFRAME LOAD
     * =========================================================
     */

    iframe.addEventListener("load", () => {

      debug("Figma iframe loaded");

      console.log(
        "[PEMIRA] iframe loaded:",
        iframe.src
      );
    });


    /*
     * =========================================================
     * FIGMA MESSAGE EVENTS
     * =========================================================
     */

    window.addEventListener("message", (event) => {

      /*
       * Event Figma Embed API berasal dari Figma.
       */

      if (
        event.origin !== "https://www.figma.com" &&
        event.origin !== "https://embed.figma.com"
      ) {
        return;
      }


      const msg = event.data || {};

      console.log(
        "[FIGMA EVENT]",
        msg
      );


      /*
       * ---------------------------------------------------------
       * INITIAL LOAD
       * ---------------------------------------------------------
       */

      if (msg.type === "INITIAL_LOAD") {

        debug("Figma siap");

        return;
      }


      /*
       * ---------------------------------------------------------
       * PRESENTED NODE CHANGED
       * ---------------------------------------------------------
       */

      if (msg.type === "PRESENTED_NODE_CHANGED") {

        const presentedNodeId =
          msg.data?.presentedNodeId || "-";

        debug(
          `screen ${presentedNodeId}`
        );

        return;
      }


      /*
       * ---------------------------------------------------------
       * MOUSE PRESS / RELEASE
       * ---------------------------------------------------------
       */

      if (msg.type === "MOUSE_PRESS_OR_RELEASE") {

        const data = msg.data || {};

        console.log(
          "[FIGMA CLICK]",
          data
        );


        /*
         * Ambil target node.
         */

        const targetNode =
          data.targetNodeId ||
          data.nodeId ||
          data.target?.id ||
          null;


        console.log(
          "[FIGMA CLICK] target:",
          targetNode
        );


        /*
         * Cari Paslon berdasarkan:
         *
         * 1. Button node
         * 2. Text node
         */

        const paslon =
          CONFIG.VOTE_BUTTONS[targetNode] ||
          CONFIG.VOTE_TEXT_NODES[targetNode] ||
          null;


        /*
         * Jika tombol vote ditemukan.
         */

        if (paslon) {

          console.log(
            "[PEMIRA] TOMBOL VOTE TERDETEKSI:",
            paslon
          );

          sendVote(paslon);

          return;
        }


        /*
         * Kalau bukan tombol vote,
         * hanya tampilkan event untuk debugging.
         */

        console.log(
          "[PEMIRA] Klik bukan tombol vote:",
          targetNode
        );
      }
    });


    /*
     * =========================================================
     * STARTUP LOG
     * =========================================================
     */

    console.log(
      "[PEMIRA] Application started."
    );

    console.log(
      "[PEMIRA] Dev mode:",
      dev
    );

    console.log(
      "[PEMIRA] iframe:",
      iframe
    );

    console.log(
      "[PEMIRA] iframe src:",
      iframe.src
    );
  </script>

</body>
</html>
```
