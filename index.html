<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PEMIRA — Voting</title>

  <!--
    CATATAN PENTING (bukan bug di file ini, tapi wajib dicek
    manual di Figma sebelum halaman ini dipakai):

    Di Figma Developer App dengan Client ID di bawah
    (FIGMA_CLIENT_ID), buka pengaturan "Allowed Embed Origins"
    dan pastikan berisi PERSIS:

        https://fawpaw.github.io

    Tanpa "/PEMIRA", tanpa trailing slash. Kalau origin belum
    diizinkan, iframe tetap bisa tampil secara visual, tapi
    event postMessage (INITIAL_LOAD, PRESENTED_NODE_CHANGED,
    MOUSE_PRESS_OR_RELEASE) yang dipakai script di bawah untuk
    mendeteksi klik tombol vote bisa tidak stabil.
  -->

  <style>
    html,
    body,
    #app {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
    }

    #app {
      position: relative;
    }

    #figma {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    #status {
      position: fixed;
      left: 10px;
      bottom: 10px;
      z-index: 10;

      background: rgba(0, 0, 0, 0.72);
      color: #fff;

      font: 12px/1.4 system-ui, sans-serif;

      padding: 7px 9px;
      border-radius: 7px;

      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
    }

    #status.visible {
      opacity: 1;
    }
  </style>
</head>

<body>

  <div id="app">
    <iframe
      id="figma"
      allowfullscreen>
    </iframe>

    <div id="status"></div>
  </div>

  <script>
    /*
     * =========================================================
     * CONFIGURATION
     * =========================================================
     */

    const CONFIG = {

      /*
       * Figma prototype
       */
      FIGMA_FILE_KEY: "ye6WV9CRpb5QpyPNjcD7o7",

      /*
       * Figma Embed API Client ID
       */
      FIGMA_CLIENT_ID: "WtJAjvjMcjz1x0tX3D8kgZ",

      /*
       * Starting point prototype
       */
      START_NODE_ID: "61-293",

      /*
       * Google Apps Script Web App.
       *
       * Ambil dari: Apps Script editor > Deploy >
       * Manage deployments > Web app URL (harus diakhiri /exec).
       *
       * PENTING: setiap kali Code.gs diedit, URL ini HANYA
       * tetap valid kalau Anda deploy ulang lewat "Manage
       * deployments" pada deployment yang SAMA (Edit > New
       * version), bukan membuat "New deployment" baru yang
       * akan menghasilkan URL /exec berbeda.
       */
      API_URL:
        "https://script.google.com/macros/s/AKfycbwZCDgEgayB0RMz6kiyT9v06Dq8cME0XU7co2Ay-mU3-nsvstXRu6xfDMSffP9TMKVbEw/exec",

      /*
       * Tombol konfirmasi vote.
       *
       * Format:
       * "NODE_ID": "PASLON"
       */
      VOTE_BUTTONS: {
        "133:1031": "Paslon 1",
        "133:933": "Paslon 2",
        "133:982": "Paslon 3"
      },

      /*
       * Text node di dalam tombol.
       *
       * Dipakai sebagai fallback apabila event Figma
       * mengembalikan ID text layer, bukan parent button.
       */
      VOTE_TEXT_NODES: {
        "133:1032": "Paslon 1",
        "133:934": "Paslon 2",
        "133:983": "Paslon 3"
      },

      /*
       * Berapa lama menunggu response Apps Script sebelum
       * dianggap timeout.
       */
      REQUEST_TIMEOUT_MS: 15000
    };


    /*
     * =========================================================
     * DEV MODE
     * =========================================================
     */

    const params = new URLSearchParams(window.location.search);
    const dev = params.get("dev");

    if (!["1", "2", "3"].includes(dev)) {

      document.body.innerHTML = `
        <div style="
          font: 20px system-ui, sans-serif;
          color: white;
          padding: 30px;
        ">
          Link Dev tidak valid.
          Gunakan ?dev=1, ?dev=2, atau ?dev=3.
        </div>
      `;

      throw new Error("Invalid dev parameter");
    }


    /*
     * =========================================================
     * ELEMENTS
     * =========================================================
     */

    const iframe = document.getElementById("figma");
    const statusEl = document.getElementById("status");


    /*
     * =========================================================
     * VALIDATE CONFIG
     * =========================================================
     */

    if (!CONFIG.FIGMA_FILE_KEY) {
      throw new Error("FIGMA_FILE_KEY belum diisi.");
    }

    if (!CONFIG.FIGMA_CLIENT_ID) {
      throw new Error("FIGMA_CLIENT_ID belum diisi.");
    }

    if (!CONFIG.START_NODE_ID) {
      throw new Error("START_NODE_ID belum diisi.");
    }

    if (!CONFIG.API_URL) {
      throw new Error("API_URL belum diisi.");
    }


    /*
     * =========================================================
     * FIGMA EMBED URL
     * =========================================================
     */

    const figmaUrl =
      `https://embed.figma.com/proto/${CONFIG.FIGMA_FILE_KEY}/IT-DOK-PEMIRA` +
      `?node-id=${encodeURIComponent(CONFIG.START_NODE_ID)}` +
      `&starting-point-node-id=${encodeURIComponent(CONFIG.START_NODE_ID)}` +
      `&embed-host=pemira-voting` +
      `&client-id=${encodeURIComponent(CONFIG.FIGMA_CLIENT_ID)}`;

    iframe.src = figmaUrl;


    /*
     * =========================================================
     * DEBUG / STATUS
     * =========================================================
     */

    let statusHideTimer = null;

    function debug(message) {

      console.log("[PEMIRA]", message);

      statusEl.textContent = `Dev ${dev} · ${message}`;
      statusEl.classList.add("visible");

      if (statusHideTimer) {
        clearTimeout(statusHideTimer);
      }

      statusHideTimer = setTimeout(() => {
        statusEl.classList.remove("visible");
      }, 4000);
    }

    console.log("[PEMIRA] Figma URL:", figmaUrl);
    console.log("[PEMIRA] Dev:", dev);
    console.log("[PEMIRA] API URL:", CONFIG.API_URL);


    /*
     * =========================================================
     * VOTING STATE
     * =========================================================
     */

    let sending = false;


    /*
     * =========================================================
     * SEND VOTE (JSONP)
     * =========================================================
     *
     * Dipakai karena target-nya Google Apps Script Web App dan
     * kita ingin hindari isu CORS. Konsekuensinya: ini SELALU
     * request GET. Code.gs sisi backend HARUS memproses vote
     * di doGet (bukan doPost) supaya ini benar-benar tersimpan.
     */

    function sendVote(paslon) {

      if (!paslon) {
        return;
      }

      if (sending) {
        console.log("[PEMIRA] Request masih berjalan.");
        return;
      }

      sending = true;
      debug(`mengirim ${paslon}...`);

      const callbackName = "__pemiraCallback";

      if (window[callbackName]) {
        delete window[callbackName];
      }

      let finished = false;
      let timeoutId = null;

      const finish = () => {

        sending = false;

        if (timeoutId) {
          clearTimeout(timeoutId);
        }

        if (script && script.parentNode) {
          script.parentNode.removeChild(script);
        }

        delete window[callbackName];
      };

      window[callbackName] = (result) => {

        console.log("[PEMIRA] API response:", result);

        if (finished) {
          return;
        }

        finished = true;
        finish();

        if (result && result.success === true) {

          debug(`tersimpan: ${paslon}`);
          console.log("[PEMIRA] Vote BERHASIL disimpan:", paslon);

        } else {

          const errorMessage =
            (result && result.error) || "Vote gagal disimpan.";

          debug(`gagal: ${errorMessage}`);
          console.error("[PEMIRA] Vote GAGAL:", errorMessage);
        }
      };

      const script = document.createElement("script");

      const url =
        `${CONFIG.API_URL}` +
        `?dev=${encodeURIComponent(dev)}` +
        `&paslon=${encodeURIComponent(paslon)}` +
        `&callback=${encodeURIComponent(callbackName)}` +
        `&t=${Date.now()}`;

      console.log("[PEMIRA] Vote URL:", url);

      script.onerror = () => {

        if (finished) {
          return;
        }

        finished = true;
        finish();

        debug("gagal terhubung ke server.");
        console.error("[PEMIRA] Request API gagal dimuat.");
      };

      script.src = url;
      document.head.appendChild(script);

      timeoutId = setTimeout(() => {

        if (finished) {
          return;
        }

        finished = true;
        finish();

        debug("server timeout.");
        console.error("[PEMIRA] API timeout.");

      }, CONFIG.REQUEST_TIMEOUT_MS);
    }


    /*
     * =========================================================
     * FIGMA IFRAME LOAD
     * =========================================================
     */

    iframe.addEventListener("load", () => {

      debug("Figma iframe loaded");
      console.log("[PEMIRA] iframe loaded:", iframe.src);
    });


    /*
     * =========================================================
     * FIGMA MESSAGE EVENTS
     * =========================================================
     */

    window.addEventListener("message", (event) => {

      if (
        event.origin !== "https://www.figma.com" &&
        event.origin !== "https://embed.figma.com"
      ) {
        return;
      }

      const msg = event.data || {};

      console.log("[FIGMA EVENT]", msg);

      if (msg.type === "INITIAL_LOAD") {
        debug("Figma siap");
        return;
      }

      if (msg.type === "PRESENTED_NODE_CHANGED") {

        const presentedNodeId = (msg.data && msg.data.presentedNodeId) || "-";

        debug(`screen ${presentedNodeId}`);
        return;
      }

      if (msg.type === "MOUSE_PRESS_OR_RELEASE") {

        const data = msg.data || {};

        console.log("[FIGMA CLICK]", data);

        const targetNode =
          data.targetNodeId ||
          data.nodeId ||
          (data.target && data.target.id) ||
          null;

        console.log("[FIGMA CLICK] target:", targetNode);

        const paslon =
          CONFIG.VOTE_BUTTONS[targetNode] ||
          CONFIG.VOTE_TEXT_NODES[targetNode] ||
          null;

        if (paslon) {

          console.log("[PEMIRA] TOMBOL VOTE TERDETEKSI:", paslon);
          sendVote(paslon);
          return;
        }

        console.log("[PEMIRA] Klik bukan tombol vote:", targetNode);
      }
    });


    /*
     * =========================================================
     * STARTUP LOG
     * =========================================================
     */

    console.log("[PEMIRA] Application started.");
    console.log("[PEMIRA] Dev mode:", dev);
    console.log("[PEMIRA] iframe:", iframe);
    console.log("[PEMIRA] iframe src:", iframe.src);
  </script>

</body>
</html>
